function corr(s){return `<details class="corr"><summary>Correlatividades de la materia</summary><table><caption class="sr">Correlatividades de ${s.name}</caption><thead><tr><th>Condición</th><th>Regular</th><th>Aprobada</th></tr></thead><tbody><tr><th>Para cursar</th><td>${s.corr[0]}</td><td>${s.corr[1]}</td></tr><tr><th>Para rendir</th><td>${s.corr[2]}</td><td>${s.corr[3]}</td></tr></tbody></table><p>Los números corresponden a los códigos del índice. Se conserva la notación de la RR 11080003-ULP-2024.</p><a class="external" href="documentos/correlatividades-2024.pdf" target="_blank" rel="noopener">Consultar resolución ↗</a></details>`}
function content(n){if(n===0)return `<section class="page left cover"><div class="eyebrow">Instituto de Ciencia y Tecnología / TUSSTMA</div><h1 class="serif">Cuidar también<br>es transformar.</h1><p class="cover-title">Tecnicatura Universitaria en <strong>Salud, Seguridad en el Trabajo y Medioambiente</strong></p><div class="leaf-cover">${art('ambiente','el cuidado del ambiente')}</div><span class="pill">A distancia</span><span class="pill">3 años · 6 cuatrimestres</span><span class="pill">1664 horas</span>${footer('FORMACIÓN PARA LA PREVENCIÓN',1)}</section><section class="page right profile"><div class="eyebrow">Salud · Trabajo · Ambiente</div><h2 class="serif">Una profesión<br>que cuida.</h2><p>Formación para actuar en la prevención de riesgos, accidentes y enfermedades profesionales en empresas e instituciones públicas y privadas, promoviendo una mejor calidad del trabajo.</p><ul><li>Promover la salud y la seguridad en el ámbito laboral.</li><li>Participar en equipos interdisciplinarios.</li><li>Contribuir a la gestión ambiental y al manejo de residuos.</li></ul><div class="feature"><strong>Práctica profesionalizante ↗</strong><p>Integrá los conocimientos y las técnicas de la carrera en situaciones propias de la práctica profesional.</p><button class="entry" style="color:var(--accent);border-color:#728775" data-go="26">Conocé este espacio →</button></div><p class="quiet">Modalidad a distancia. Práctica profesionalizante semipresencial.</p>${footer('UNIVERSIDAD DE LA PUNTA',2)}</section>`;
if(n===1)return `<section class="page left index-page"><div class="eyebrow">Tu recorrido / Plan de estudios</div><h2 class="index-title">Un recorrido<br>para prevenir.</h2><p class="quiet index-intro">Elegí una materia. ▶ identifica las presentaciones con video. Cada página incluye sus correlatividades.</p>${group(1)}${group(2)}${group(3)}${footer('PRIMERO Y SEGUNDO AÑO',3)}</section><section class="page right index-page"><div class="eyebrow">El recorrido continúa</div>${group(4)}${group(5)}${group(6)}<div class="docs"><a href="documentos/plan-2019.pdf" target="_blank" rel="noopener">Plan de estudios · RR 12120003-ULP-2019 ↗</a><br><a href="documentos/correlatividades-2024.pdf" target="_blank" rel="noopener">Correlatividades · RR 11080003-ULP-2024 ↗</a></div>${footer('SEGUNDO Y TERCER AÑO',4)}</section>`;
const s=subjects[n-2],practice=s.code===25;return `<section class="page left subject-left"><div class="eyebrow">${s.year}º año / ${s.term}º cuatrimestre</div><div class="subject-no">${String(s.code).padStart(2,'0')}</div><h1 class="serif subject-title">${s.name}</h1><span class="pill">${practice?'Semipresencial':'A distancia'}</span><span class="pill">${s.hours} horas</span><p>${s.intro}</p>${corr(s)}${footer('TUSSTMA / CONOCÉ LA CARRERA',n*2+1)}</section><section class="page right subject-right"><div class="eyebrow">${s.video?'Presentación en video':'Explorá tu formación'}</div><h2 class="serif">${s.video?'Una mirada<br>a la materia.':practice?'Tu formación,<br>en acción.':'Conocimientos<br>que se conectan.'}</h2>${s.video?`<div class="video-box"><button data-play="${s.video}" aria-label="Reproducir presentación de ${s.name}"><span class="play">▶</span>Ver presentación</button></div><a class="external" href="https://youtu.be/${s.video}" target="_blank" rel="noopener">Abrir en YouTube ↗</a><p class="quiet">Si el reproductor no está disponible, abrí el video en YouTube.</p>`:`<figure class="illustration">${art(s.theme,s.name)}<figcaption class="caption">${s.name}</figcaption></figure><p class="compact">${practice?'Un espacio de 128 horas para integrar conocimientos y técnicas, resolver situaciones propias del ejercicio profesional y reflexionar sobre la futura práctica.':'Este espacio forma parte del recorrido de formación de la carrera. Consultá sus requisitos en el apartado de correlatividades.'}</p>`}<button class="entry" data-go="1">← Volver al índice completo</button>${footer('UNIVERSIDAD DE LA PUNTA',n*2+2)}<div class="corner" aria-hidden="true"></div></section>`}
function render(){spread.innerHTML=content(current);document.querySelector('#prev').disabled=current===0;document.querySelector('#next').disabled=current===total-1;document.querySelector('#progress').innerHTML=`${current===0?'Portada':current===1?'Índice de materias':subjects[current-2].name}<span class="hint">${current+1} / ${total} · HOJEÁ CON LAS FLECHAS</span>`;document.querySelector('#bar').style.width=((current+1)/total*100)+'%';document.querySelector('#home').classList.toggle('active',current===0);document.querySelector('#index').classList.toggle('active',current===1)}
async function go(n){if(busy||n<0||n>=total||n===current)return;busy=true;let forward=n>current,old=spread.querySelector(forward?'.right':'.left').cloneNode(true);old.querySelectorAll('iframe').forEach(e=>e.remove());current=n;render();if(!matchMedia('(prefers-reduced-motion: reduce)').matches){let turn=document.createElement('div');turn.className='turn '+(forward?'next':'prev');turn.setAttribute('aria-hidden','true');turn.inert=true;let face=document.createElement('div');face.className='face';face.append(old);turn.append(face);let back=document.createElement('div');back.className='face back';turn.append(back);book.append(turn);try{await turn.animate([{transform:'rotateY(0deg)'},{transform:`rotateY(${forward?-180:180}deg)`}],{duration:800,easing:'cubic-bezier(.3,.1,.25,1)',fill:'forwards'}).finished}finally{turn.remove()}}busy=false}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g)go(Number(g.dataset.go));const p=e.target.closest('[data-play]');if(p){let f=document.createElement('iframe');f.src=`https://www.youtube.com/embed/${p.dataset.play}?autoplay=1&rel=0`;f.title='Presentación de '+subjects[current-2].name;f.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';f.allowFullscreen=true;p.parentElement.replaceChildren(f)}});document.querySelector('#home').onclick=()=>go(0);document.querySelector('#index').onclick=()=>go(1);document.querySelector('#prev').onclick=()=>go(current-1);document.querySelector('#next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.target.closest('button,a,iframe,input,summary'))return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});let start=null;book.addEventListener('pointerdown',e=>{if(!e.target.closest('button,a,iframe,summary,table'))start=[e.clientX,e.clientY]});book.addEventListener('pointerup',e=>{if(!start)return;let dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*1.5)go(current+(dx<0?1:-1))});book.addEventListener('pointercancel',()=>start=null);render();</script></body></html>
